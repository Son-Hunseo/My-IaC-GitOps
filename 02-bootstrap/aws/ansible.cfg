[defaults]
# 인벤토리 기본 위치를 AWS EKS용 로컬 인벤토리로 고정합니다.
inventory = inventory/eks.yml
# roles_path는 일부러 지정하지 않습니다.
# ansible.cfg의 상대 경로는 설정 파일 위치가 아니라 실행 시점의 CWD를 기준으로
# 해석되기 때문입니다. 플레이북(02-bootstrap/*.yml)이 02-bootstrap/roles/ 와
# 같은 디렉터리에 있으므로 Ansible이 알아서 찾습니다.
# 로컬 실행에서도 Python 인터프리터를 자동 탐지합니다.
interpreter_python = auto_silent
# 권한 문제를 빠르게 확인할 수 있도록 콜백 출력을 기본값으로 둡니다.
stdout_callback = default
# 재시도 파일은 저장소를 지저분하게 만들 수 있어 생성하지 않습니다.
retry_files_enabled = False

[privilege_escalation]
# EKS bootstrap은 kubectl 로컬 실행 중심이므로 기본 권한 상승을 사용하지 않습니다.
become = False
