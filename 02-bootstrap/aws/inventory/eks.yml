---
# 기존 EKS 클러스터에 접속할 로컬 실행 호스트 인벤토리입니다.
# AWS 인프라 생성은 01-infra 단계에서 끝났다고 가정하고, 이 인벤토리는 GitOps 도구 설치에만 사용합니다.
all:
  children:
    eks_admin:
      hosts:
        localhost:
          ansible_connection: local
  vars:
    # kubectl이 사용할 kubeconfig 경로입니다. 환경에 맞게 절대 경로로 바꿔도 됩니다.
    argocd_kubeconfig: "{{ lookup('env', 'KUBECONFIG') | default(lookup('env', 'HOME') ~ '/.kube/config', true) }}"

    # 여러 클러스터가 있는 kubeconfig를 사용할 때 컨텍스트 이름을 명시하세요.
    # 비워두면 현재 kubeconfig의 기본 컨텍스트를 사용합니다.
    argocd_kube_context: ""
