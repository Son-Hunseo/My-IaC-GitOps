---
# kubespray로 만든 온프렘 클러스터에 02-bootstrap 자체 add-on을 설치합니다.
#
# MetalLB, metrics-server, cert-manager, Gateway API CRD는 kubespray 내장 add-on이
# 담당하므로(인벤토리의 *_enabled 변수) 여기에 없습니다.
# kubespray가 다루지 않는 것만 남습니다.
#
#   - Argo CD          : kubespray 내장 add-on 대신 EKS와 같은 role을 씁니다
#   - kubeconfig 병합  : 실행 호스트의 ~/.kube/config 에 컨텍스트를 등록합니다
- name: Install 02-bootstrap add-ons on the on-premise cluster
  hosts: kube_control_plane[0]
  become: true
  gather_facts: false
  roles:
    # control plane 노드에서 kubespray가 만든 admin.conf로 kubectl을 실행합니다.
    - role: argocd
      tags:
        - argocd

    # 이 role은 내부에서 localhost로 위임되어 실행 호스트의 kubeconfig를 고칩니다.
    - role: kubeconfig-merge
      tags:
        - kubeconfig
