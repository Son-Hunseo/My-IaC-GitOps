[defaults]
# 이 설정은 02-bootstrap 자체 add-on 플레이북(playbooks/onprem-*.yml)에만 사용합니다.
# kubespray 플레이북은 kubespray 저장소의 ansible.cfg로 실행해야 합니다.
# (scripts/onprem-bootstrap.sh 가 두 실행을 알아서 나눠서 처리합니다)
inventory = inventory/hosts.yml
# roles_path는 일부러 지정하지 않습니다.
# ansible.cfg의 상대 경로는 설정 파일 위치가 아니라 실행 시점의 CWD를 기준으로
# 해석되기 때문입니다. 플레이북(02-bootstrap/*.yml)이 02-bootstrap/roles/ 와
# 같은 디렉터리에 있으므로 Ansible이 알아서 찾습니다.
# 원격 호스트의 Python 인터프리터를 자동 탐지합니다.
interpreter_python = auto_silent
# SSH 접속 실패나 권한 문제를 빠르게 확인할 수 있도록 콜백 출력을 기본값으로 둡니다.
stdout_callback = default
# 재시도 파일은 저장소를 지저분하게 만들 수 있어 생성하지 않습니다.
retry_files_enabled = False
# 호스트 키 검사는 초기 VM 재생성 시 반복 작업을 방해할 수 있어 비활성화합니다.
host_key_checking = False
# kubespray가 만드는 로컬 산출물 디렉터리는 인벤토리로 읽지 않습니다.
inventory_ignore_extensions = ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo, .creds, .gpg

[inventory]
ignore_patterns = artifacts, credentials

[privilege_escalation]
# 대부분의 부트스트랩 작업은 root 권한이 필요하므로 기본 sudo 상승을 활성화합니다.
become = True
become_method = sudo

[ssh_connection]
pipelining = True
