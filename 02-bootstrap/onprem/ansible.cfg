[defaults]
# 인벤토리 기본 위치를 On-Premise VM용 인벤토리로 고정합니다.
inventory = inventory/hosts.yml
# On-Premise bootstrap role은 이 실행 단위 내부 roles 디렉터리에서 관리합니다.
roles_path = roles
# 원격 호스트의 Python 인터프리터를 자동 탐지합니다.
interpreter_python = auto_silent
# SSH 접속 실패나 권한 문제를 빠르게 확인할 수 있도록 콜백 출력을 기본값으로 둡니다.
stdout_callback = default
# 재시도 파일은 저장소를 지저분하게 만들 수 있어 생성하지 않습니다.
retry_files_enabled = False
# 호스트 키 검사는 초기 VM 재생성 시 반복 작업을 방해할 수 있어 비활성화합니다.
host_key_checking = False

[privilege_escalation]
# 대부분의 부트스트랩 작업은 root 권한이 필요하므로 기본 sudo 상승을 활성화합니다.
become = True
become_method = sudo
