---
# Proxmox VM 인벤토리 예시입니다.
# 실제 운영 전 ansible_host, ansible_user, ansible_ssh_private_key_file 값을 환경에 맞게 수정하세요.
all:
  children:
    k8s_cluster:
      children:
        kube_control_plane:
          hosts:
            k8s-master-01:
              ansible_host: 192.168.0.101
              ansible_user: ubuntu
              # SSH 키 경로가 기본값이 아니면 아래 값을 활성화하세요.
              # ansible_ssh_private_key_file: ~/.ssh/id_rsa
        kube_workers:
          hosts:
            k8s-worker-01:
              ansible_host: 192.168.0.102
              ansible_user: ubuntu
            k8s-worker-02:
              ansible_host: 192.168.0.103
              ansible_user: ubuntu
  vars:
    # Python 자동 탐지가 실패하는 최소 이미지에서는 아래 값을 명시하세요.
    ansible_python_interpreter: /usr/bin/python3
