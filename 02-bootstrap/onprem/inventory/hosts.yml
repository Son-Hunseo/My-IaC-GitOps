---
# kubespray 인벤토리입니다. 그룹 이름(kube_control_plane, kube_node, etcd,
# k8s_cluster)은 kubespray가 요구하는 이름이므로 바꾸지 마세요.
#
# 01-infra/onprem 의 terraform.tfvars 값과 맞춰야 합니다.
# 아래 IP와 사용자명은 01-infra/onprem/terraform/terraform.tfvars.example 기준 예시입니다.
#
# 각 호스트의 `ip`는 kubelet/etcd/Calico가 바인딩할 노드 내부 IP입니다.
# NIC이 하나뿐이면 ansible_host와 같은 값을 쓰면 됩니다.
all:
  hosts:
    gitops-k8s-master-01:
      ansible_host: 192.168.10.11
      ip: 192.168.10.11
      etcd_member_name: etcd1
    gitops-k8s-worker-01:
      ansible_host: 192.168.10.21
      ip: 192.168.10.21
    gitops-k8s-worker-02:
      ansible_host: 192.168.10.22
      ip: 192.168.10.22
  vars:
    # Proxmox cloud-init 이미지의 기본 사용자입니다.
    ansible_user: ubuntu
    # SSH 키 경로가 기본값이 아니면 아래 값을 활성화하세요.
    # ansible_ssh_private_key_file: ~/.ssh/id_rsa
    # Python 자동 탐지가 실패하는 최소 이미지에서는 아래 값을 명시하세요.
    ansible_python_interpreter: /usr/bin/python3
  children:
    kube_control_plane:
      hosts:
        gitops-k8s-master-01:
    kube_node:
      hosts:
        gitops-k8s-worker-01:
        gitops-k8s-worker-02:
    # etcd는 control plane 노드에 함께 배치합니다. (stacked etcd)
    etcd:
      hosts:
        gitops-k8s-master-01:
    # kubespray가 클러스터 전체를 지칭할 때 사용하는 그룹입니다.
    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:
    # kubespray가 참조하지만 이 구성에서는 비워 두는 그룹입니다.
    calico_rr:
      hosts: {}
