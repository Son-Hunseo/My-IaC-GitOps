---
# kubeadm으로 만든 Proxmox Kubernetes 클러스터에 Argo CD를 설치합니다.
- name: Install Argo CD on Proxmox Kubernetes cluster
  hosts: kube_control_plane[0]
  become: true
  gather_facts: false
  vars:
    # kubeadm으로 생성한 관리자 kubeconfig를 사용해 Proxmox 클러스터에 Argo CD를 설치합니다.
    argocd_kubeconfig: /etc/kubernetes/admin.conf
  roles:
    - role: argocd
