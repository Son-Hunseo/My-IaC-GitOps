---
# Kubernetes CRI로 사용할 containerd를 OS 패키지 저장소에서 설치합니다.
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true

# containerd 설정 파일을 저장할 디렉터리를 보장합니다.
- name: Ensure containerd config directory exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: '0755'

# containerd 기본 설정을 생성합니다. creates로 이미 생성된 설정을 덮어쓰지 않습니다.
- name: Generate default containerd config
  ansible.builtin.command: containerd config default
  register: containerd_default_config
  changed_when: false

# kubelet 권장값에 맞춰 containerd 설정을 배포합니다.
- name: Write containerd config
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: '0644'
    content: |
      {{ containerd_default_config.stdout
         | regex_replace('SystemdCgroup = false', 'SystemdCgroup = ' ~ (containerd_systemd_cgroup | ternary('true', 'false')))
         | regex_replace('sandbox_image = "registry.k8s.io/pause:[^"]+"', 'sandbox_image = "' ~ containerd_sandbox_image ~ '"')
         | regex_replace("config_path = '/etc/containerd/certs.d:/etc/docker/certs.d'", "config_path = '/etc/containerd/certs.d'") }}
  notify: Restart containerd

# containerd가 부팅 시 자동 시작되도록 활성화합니다.
- name: Enable and start containerd
  ansible.builtin.service:
    name: containerd
    state: started
    enabled: true
