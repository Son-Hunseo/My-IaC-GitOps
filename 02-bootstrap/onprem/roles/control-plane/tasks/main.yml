---
# kubeadm init 설정 파일을 대상 노드에 렌더링합니다.
- name: Render kubeadm init config
  ansible.builtin.template:
    src: "{{ role_path }}/../kubeadm/templates/kubeadm-config.yml.j2"
    dest: /root/kubeadm-config.yml
    owner: root
    group: root
    mode: '0600'

# 기존 control plane 초기화 여부를 확인합니다.
- name: Check if control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf

# 아직 초기화되지 않은 경우에만 kubeadm init을 실행합니다.
- name: Initialize Kubernetes control plane
  ansible.builtin.command: kubeadm init --config /root/kubeadm-config.yml --upload-certs
  register: kubeadm_init_result
  changed_when: kubeadm_init_result.rc == 0
  when: not kubeadm_admin_conf.stat.exists

# 일반 사용자 kubeconfig 디렉터리를 생성합니다.
- name: Ensure admin kubeconfig directory exists
  ansible.builtin.file:
    path: "/home/{{ kubernetes_admin_user }}/.kube"
    state: directory
    owner: "{{ kubernetes_admin_user }}"
    group: "{{ kubernetes_admin_user }}"
    mode: '0700'

# kubectl을 바로 사용할 수 있도록 admin.conf를 일반 사용자 홈에 복사합니다.
- name: Copy admin kubeconfig for Kubernetes admin user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ kubernetes_admin_user }}/.kube/config"
    owner: "{{ kubernetes_admin_user }}"
    group: "{{ kubernetes_admin_user }}"
    mode: '0600'
    remote_src: true

# worker join 단계에서 사용할 join 명령을 새로 생성합니다.
- name: Create current worker join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: kubeadm_join_command
  changed_when: false

# 같은 Ansible 실행 내 다른 호스트가 참조할 수 있도록 join 명령을 fact로 저장합니다.
- name: Store worker join command as host fact
  ansible.builtin.set_fact:
    kubernetes_worker_join_command: "{{ kubeadm_join_command.stdout }}"
