---
# Kubernetes 패키지 서명 키를 저장할 디렉터리를 보장합니다.
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

# Kubernetes 공식 패키지 저장소 서명 키를 설치합니다.
- name: Download Kubernetes apt signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    owner: root
    group: root
    mode: '0644'

# Kubernetes minor 버전에 맞는 공식 apt 저장소를 등록합니다.
- name: Configure Kubernetes apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    owner: root
    group: root
    mode: '0644'
    content: |
      # Kubernetes v{{ kubernetes_version }} 공식 패키지 저장소입니다.
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_version }}/deb/ /
  register: kubernetes_repo

# 저장소가 변경되었거나 패키지 캐시가 오래된 경우 apt 캐시를 갱신합니다.
- name: Update apt cache for Kubernetes packages
  ansible.builtin.apt:
    update_cache: true
  when: kubernetes_repo.changed

# 패치 버전을 지정하지 않은 경우 해당 minor 저장소의 최신 kubelet, kubeadm, kubectl을 설치합니다.
- name: Install Kubernetes packages
  ansible.builtin.apt:
    name:
      - "{{ 'kubelet=' ~ kubernetes_patch_version if kubernetes_patch_version | length > 0 else 'kubelet' }}"
      - "{{ 'kubeadm=' ~ kubernetes_patch_version if kubernetes_patch_version | length > 0 else 'kubeadm' }}"
      - "{{ 'kubectl=' ~ kubernetes_patch_version if kubernetes_patch_version | length > 0 else 'kubectl' }}"
    state: present
    update_cache: true

# 의도하지 않은 자동 업그레이드로 클러스터 버전이 흔들리지 않도록 hold 처리합니다.
- name: Hold Kubernetes package versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl

# kubelet이 부팅 시 자동 시작되도록 활성화합니다.
- name: Enable kubelet service
  ansible.builtin.service:
    name: kubelet
    enabled: true
