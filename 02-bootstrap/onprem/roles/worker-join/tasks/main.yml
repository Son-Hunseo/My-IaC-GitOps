---
# worker가 이미 클러스터에 join되어 있는지 확인합니다.
- name: Check if worker is already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

# 독립 실행 시에도 join 명령을 얻을 수 있도록 control plane에서 새 토큰을 생성합니다.
- name: Create join command on control plane
  ansible.builtin.command: kubeadm token create --print-join-command
  register: worker_join_command
  changed_when: false
  delegate_to: "{{ groups['kube_control_plane'][0] }}"
  run_once: true

# 아직 join되지 않은 worker만 kubeadm join을 실행합니다.
- name: Join worker node to Kubernetes cluster
  ansible.builtin.command: "{{ worker_join_command.stdout }} --cri-socket unix:///run/containerd/containerd.sock"
  register: kubeadm_join_result
  changed_when: kubeadm_join_result.rc == 0
  when: not kubelet_conf.stat.exists
