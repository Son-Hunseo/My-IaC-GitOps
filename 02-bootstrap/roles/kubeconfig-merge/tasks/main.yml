---
# 이 역할의 모든 작업은 Ansible 실행 호스트에서 동작해야 합니다.
# 플레이북은 control plane 노드를 대상으로 하므로 블록 단위로 위임하고,
# 실행 호스트의 홈 디렉터리에 쓰는 작업이라 권한 상승도 하지 않습니다.
- name: Merge the kubespray kubeconfig into the Ansible host kubeconfig
  delegate_to: localhost
  become: false
  when: kubeconfig_merge_enabled | bool
  block:
    # 실행 호스트에 kubectl이 없으면 병합할 방법이 없습니다.
    # 부트스트랩 자체는 성공한 상태이므로 실패시키지 않고 안내만 남깁니다.
    - name: Check whether kubectl is available on the Ansible host
      ansible.builtin.command: "{{ kubeconfig_merge_kubectl_bin }} version --client=true"
      register: kubeconfig_merge_kubectl_check
      changed_when: false
      failed_when: false

    - name: Explain why the kubeconfig merge is skipped
      ansible.builtin.debug:
        msg: >-
          Ansible 실행 호스트에 '{{ kubeconfig_merge_kubectl_bin }}' 가 없어 kubeconfig 병합을 건너뜁니다.
          kubectl 설치 후 다시 실행하거나, '{{ kubeconfig_merge_source }}' 를 직접 사용하세요.
      when: kubeconfig_merge_kubectl_check.rc | default(1) != 0

    - name: Merge the kubeconfig
      # 실행 파일이 아예 없으면 command 모듈이 rc를 남기지 않는 경우가 있어 기본값을 둡니다.
      when: kubeconfig_merge_kubectl_check.rc | default(1) == 0
      block:
        # kubespray가 산출물을 내려놓기 전에 실행되면 여기서 멈추는 편이 낫습니다.
        - name: Check that the kubespray kubeconfig artifact exists
          ansible.builtin.stat:
            path: "{{ kubeconfig_merge_source }}"
          register: kubeconfig_merge_source_stat

        - name: Fail when the kubespray kubeconfig artifact is missing
          ansible.builtin.fail:
            msg: >-
              '{{ kubeconfig_merge_source }}' 가 없습니다.
              kubespray playbooks/cluster.yml 을 먼저 실행하고, 인벤토리에
              kubeconfig_localhost: true 가 설정되어 있는지 확인하세요.
          when: not kubeconfig_merge_source_stat.stat.exists

        - name: Create a temporary working directory
          ansible.builtin.tempfile:
            state: directory
            suffix: kubeconfig-merge
          register: kubeconfig_merge_tmp

        # 원본을 그대로 두고 사본에서 컨텍스트 이름을 바꿉니다.
        - name: Copy the kubespray kubeconfig into the working directory
          ansible.builtin.copy:
            src: "{{ kubeconfig_merge_source }}"
            dest: "{{ kubeconfig_merge_tmp.path }}/source.conf"
            mode: "0600"

        - name: Read the context name inside the kubespray kubeconfig
          ansible.builtin.command: >-
            {{ kubeconfig_merge_kubectl_bin }}
            --kubeconfig {{ kubeconfig_merge_tmp.path }}/source.conf
            config current-context
          register: kubeconfig_merge_source_context
          changed_when: false

        - name: Rename the context to {{ kubeconfig_merge_context_name }}
          ansible.builtin.command: >-
            {{ kubeconfig_merge_kubectl_bin }}
            --kubeconfig {{ kubeconfig_merge_tmp.path }}/source.conf
            config rename-context
            {{ kubeconfig_merge_source_context.stdout | trim }}
            {{ kubeconfig_merge_context_name }}
          changed_when: true
          when: (kubeconfig_merge_source_context.stdout | trim) != kubeconfig_merge_context_name

        - name: Ensure the kubeconfig directory exists
          ansible.builtin.file:
            path: "{{ kubeconfig_merge_dest | dirname }}"
            state: directory
            mode: "0700"

        - name: Check whether the destination kubeconfig already exists
          ansible.builtin.stat:
            path: "{{ kubeconfig_merge_dest }}"
          register: kubeconfig_merge_dest_stat

        # 병합이 current-context를 바꾸므로, 유지해야 할 경우를 대비해 먼저 읽어 둡니다.
        - name: Read the current context before merging
          ansible.builtin.command: >-
            {{ kubeconfig_merge_kubectl_bin }}
            --kubeconfig {{ kubeconfig_merge_dest }}
            config current-context
          register: kubeconfig_merge_previous_context
          changed_when: false
          failed_when: false
          when: kubeconfig_merge_dest_stat.stat.exists

        # KUBECONFIG에 여러 파일을 이어 붙이면 kubectl이 하나로 합쳐서 보여 줍니다.
        # --flatten 이 참조로만 남는 인증서 파일 경로까지 값으로 인라인해 주므로
        # 결과 파일 하나만 들고 다녀도 접속이 됩니다.
        #
        # 순서가 중요합니다. 이름이 겹치는 항목은 앞쪽 파일이 이깁니다.
        # 새로 만든 kubeconfig를 앞에 둬야 클러스터를 재생성했을 때 갱신된
        # 인증서가 반영됩니다. 뒤에 두면 예전 자격증명이 그대로 남습니다.
        - name: Render the merged kubeconfig
          ansible.builtin.shell:
            cmd: >-
              set -eu;
              umask 077;
              KUBECONFIG="{{ ([kubeconfig_merge_tmp.path ~ '/source.conf'] + ([kubeconfig_merge_dest] if kubeconfig_merge_dest_stat.stat.exists else [])) | join(':') }}"
              {{ kubeconfig_merge_kubectl_bin }} config view --flatten
              > "{{ kubeconfig_merge_tmp.path }}/merged.conf"
          changed_when: false

        # 내용이 같으면 copy가 알아서 건너뛰므로 재실행해도 파일이 흔들리지 않습니다.
        - name: Install the merged kubeconfig
          ansible.builtin.copy:
            src: "{{ kubeconfig_merge_tmp.path }}/merged.conf"
            dest: "{{ kubeconfig_merge_dest }}"
            remote_src: true
            mode: "0600"
            backup: true

        # 병합 결과의 current-context는 항상 원본 파일의 값(= 위에서 바꾼 이름)입니다.
        # 유지 설정이면 원래 값으로 되돌립니다.
        - name: Read the current context of the merged kubeconfig
          ansible.builtin.command: >-
            {{ kubeconfig_merge_kubectl_bin }}
            --kubeconfig {{ kubeconfig_merge_dest }}
            config current-context
          register: kubeconfig_merge_current_context
          changed_when: false
          failed_when: false

        - name: Set the current context
          ansible.builtin.command: >-
            {{ kubeconfig_merge_kubectl_bin }}
            --kubeconfig {{ kubeconfig_merge_dest }}
            config use-context {{ kubeconfig_merge_desired_context }}
          changed_when: true
          when:
            - kubeconfig_merge_desired_context | length > 0
            - (kubeconfig_merge_current_context.stdout | default('') | trim) != kubeconfig_merge_desired_context
          vars:
            kubeconfig_merge_desired_context: "{{ kubeconfig_merge_context_name if (kubeconfig_merge_set_current_context | bool) else (kubeconfig_merge_previous_context.stdout | default('') | trim) }}"

        - name: Report the resulting kubeconfig
          ansible.builtin.debug:
            msg: >-
              '{{ kubeconfig_merge_dest }}' 에 '{{ kubeconfig_merge_context_name }}' 컨텍스트를 병합했습니다.
              kubectl config get-contexts 로 확인하세요.

      always:
        - name: Remove the temporary working directory
          ansible.builtin.file:
            path: "{{ kubeconfig_merge_tmp.path }}"
            state: absent
          when: kubeconfig_merge_tmp.path is defined
