apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    # 이 프로젝트는 클러스터 플랫폼 구성요소만 관리합니다.
    iac-gitops.io/scope: cluster-platform
spec:
  description: Cluster platform add-ons and operators
  sourceRepos:
    # 실제 운영에서는 허용 저장소를 구체적인 Git URL과 Helm 저장소로 좁히십시오.
    - "*"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
