apiVersion: elbv2.k8s.aws/v1beta1
kind: IngressClassParams
metadata:
  name: alb-platform
  annotations:
    # AWS Load Balancer Controller CRD가 준비된 뒤 적용합니다.
    argocd.argoproj.io/sync-wave: "3"
spec:
  scheme: internet-facing
  ipAddressType: ipv4
  tags:
    - key: managed-by
      value: argocd
    - key: platform
      value: gitaiops
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
  annotations:
    # 애플리케이션 Ingress가 spec.ingressClassName: alb 로 참조할 수 있습니다.
    argocd.argoproj.io/sync-wave: "3"
spec:
  controller: ingress.k8s.aws/alb
  parameters:
    apiGroup: elbv2.k8s.aws
    kind: IngressClassParams
    name: alb-platform
