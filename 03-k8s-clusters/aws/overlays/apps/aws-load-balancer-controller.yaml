apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
  annotations:
    # ALB Gateway 리소스가 동작하기 전에 controller를 먼저 설치합니다.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: https://github.com/Son-Hunseo/My-IaC-GitOps
      targetRevision: main
      path: 03-k8s-clusters/aws/overlays/aws-load-balancer-controller
    - repoURL: https://aws.github.io/eks-charts
      chart: aws-load-balancer-controller
      targetRevision: 3.4.0
      helm:
        valueFiles:
          - $values/03-k8s-clusters/aws/values/aws-load-balancer-controller-values.yaml
    - repoURL: https://github.com/Son-Hunseo/My-IaC-GitOps
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
      limit: 10
    syncOptions:
      - ServerSideApply=true
