apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-external-secrets
  namespace: argocd
  annotations:
    # AWS Secrets Manager 연동 CR보다 operator를 먼저 설치합니다.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 0.10.4
      helm:
        valueFiles:
          - $values/03-k8s-clusters/aws/values/external-secrets-values.yaml
    - repoURL: https://github.com/Son-Hunseo/My-GitAIOps
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
