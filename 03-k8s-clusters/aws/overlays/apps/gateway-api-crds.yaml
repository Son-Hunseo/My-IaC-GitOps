apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-gateway-api-crds
  namespace: argocd
  annotations:
    # AWS Load Balancer Controller가 Gateway와 HTTPRoute를 처리하기 전에 표준 Gateway API CRD를 설치합니다.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.5.0
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
