apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-grafana
  namespace: argocd
  annotations:
    # Grafana는 ClusterIP Service로 두고 Internal Gateway HTTPRoute로 노출합니다.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: grafana
      targetRevision: 8.5.1
      helm:
        releaseName: grafana
        valueFiles:
          - $values/03-k8s-clusters/aws/values/grafana-values.yaml
    - repoURL: https://github.com/Son-Hunseo/My-IaC-GitOps
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
