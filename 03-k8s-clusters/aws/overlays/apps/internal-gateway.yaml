apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-internal-gateway
  namespace: argocd
  annotations:
    # Gateway API CRD와 AWS Load Balancer Controller가 준비된 뒤 내부 ALB 라우팅을 적용합니다.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: platform
  source:
    repoURL: https://github.com/Son-Hunseo/My-GitAIOps
    targetRevision: main
    path: 03-k8s-clusters/aws/overlays/internal-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
