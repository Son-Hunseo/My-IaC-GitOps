apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller-crd-waiter
  namespace: kube-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
    argocd.argoproj.io/sync-wave: "-2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aws-load-balancer-controller-crd-waiter
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aws-load-balancer-controller-crd-waiter
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aws-load-balancer-controller-crd-waiter
subjects:
  - kind: ServiceAccount
    name: aws-load-balancer-controller-crd-waiter
    namespace: kube-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: aws-load-balancer-controller-wait-for-gateway-crds
  namespace: kube-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: aws-load-balancer-controller-crd-waiter
      containers:
        - name: wait
          image: alpine/k8s:1.35.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              for crd in \
                gatewayclasses.gateway.networking.k8s.io \
                gateways.gateway.networking.k8s.io \
                httproutes.gateway.networking.k8s.io \
                grpcroutes.gateway.networking.k8s.io \
                loadbalancerconfigurations.gateway.k8s.aws \
                targetgroupconfigurations.gateway.k8s.aws \
                listenerruleconfigurations.gateway.k8s.aws
              do
                until kubectl get "crd/${crd}" >/dev/null 2>&1; do
                  sleep 5
                done
                kubectl wait --for=condition=Established --timeout=600s "crd/${crd}"
              done
