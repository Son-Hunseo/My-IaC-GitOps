apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - storage
  # 표준 Gateway API CRD와 metrics-server는 02-bootstrap이 설치하므로 여기에 없습니다.
  # 아래 gateway CRD는 ALB 전용(gateway.k8s.aws)이라 계속 GitOps로 관리합니다.
  - apps/external-secrets.yaml
  - apps/aws-load-balancer-controller-gateway-crds.yaml
  - apps/prometheus.yaml
  - apps/grafana.yaml
  - apps/aws-load-balancer-controller.yaml
  - apps/alb-config.yaml
  - apps/internal-gateway.yaml
  - apps/external-gateway.yaml
  - apps/external-secrets-aws-store.yaml
