apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onprem-external-secrets
  namespace: argocd
  annotations:
    # SecretStore와 ExternalSecret 리소스보다 operator가 먼저 설치되어야 합니다.
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 0.10.4
      helm:
        valueFiles:
          - $values/03-k8s-clusters/onprem/values/external-secrets-values.yaml
    - repoURL: https://github.com/Son-Hunseo/My-IaC-GitOps
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
