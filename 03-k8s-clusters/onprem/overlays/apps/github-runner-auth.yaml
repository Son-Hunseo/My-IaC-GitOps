apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onprem-github-runner-auth
  namespace: argocd
  annotations:
    # Vault ClusterSecretStore가 준비된 뒤 runner 인증 Secret을 생성합니다.
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform
  sources:
    - repoURL: https://github.com/Son-Hunseo/My-IaC-GitOps
      targetRevision: main
      path: 03-k8s-clusters/onprem/overlays/github-actions-runner
      helm:
        valueFiles:
          - $values/03-k8s-clusters/onprem/values/github-runner-scale-set-values.yaml
    - repoURL: https://github.com/Son-Hunseo/My-IaC-GitOps
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-runners
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
