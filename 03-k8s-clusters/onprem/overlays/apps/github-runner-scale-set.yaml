apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onprem-github-runner-scale-sets
  namespace: argocd
  annotations:
    # ARC operator와 GitHub credential Secret이 준비된 뒤 repo별 runner scale set Application을 만듭니다.
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: platform
  sources:
    - repoURL: https://github.com/Son-Hunseo/My-IaC-GitOps
      targetRevision: main
      path: 03-k8s-clusters/onprem/overlays/github-actions-runner-scale-sets
      helm:
        valueFiles:
          - $values/03-k8s-clusters/onprem/values/github-runner-scale-set-values.yaml
    - repoURL: https://github.com/Son-Hunseo/My-IaC-GitOps
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
