apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onprem-grafana
  namespace: argocd
  annotations:
    # Grafana는 Prometheus와 같은 monitoring 네임스페이스에 배치합니다.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: grafana
      targetRevision: 8.5.1
      helm:
        releaseName: grafana
        valueFiles:
          - $values/03-k8s-clusters/onprem/values/grafana-values.yaml
    - repoURL: https://github.com/Son-Hunseo/My-IaC-GitOps
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    - kind: Secret
      name: grafana
      namespace: monitoring
      jsonPointers:
        - /data/admin-password
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
    - group: apps
      kind: Deployment
      name: grafana
      namespace: monitoring
      jqPathExpressions:
        - '.spec.template.metadata.annotations["checksum/secret"]'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
