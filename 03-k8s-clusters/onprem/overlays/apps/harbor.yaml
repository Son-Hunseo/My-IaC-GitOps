apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onprem-harbor
  namespace: argocd
  annotations:
    # 사내 registry 역할을 하며 TLS와 hostname은 운영 환경에 맞게 조정합니다.
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      targetRevision: 1.15.1
      helm:
        valueFiles:
          - $values/03-k8s-clusters/onprem/values/harbor-values.yaml
    - repoURL: https://github.com/Son-Hunseo/My-GitAIOps
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
