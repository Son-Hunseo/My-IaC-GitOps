apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onprem-metallb
  namespace: argocd
  annotations:
    # IPAddressPool CR은 MetalLB CRD가 준비된 뒤 적용되어야 합니다.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: https://metallb.github.io/metallb
      chart: metallb
      targetRevision: 0.14.8
      helm:
        valueFiles:
          - $values/03-k8s-clusters/onprem/values/metallb-values.yaml
    - repoURL: https://github.com/Son-Hunseo/My-GitAIOps
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
