apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onprem-nginx-gateway-fabric
  namespace: argocd
  annotations:
    # Gateway API 구현체로 NGINX Gateway Fabric을 설치합니다.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: ghcr.io/nginx/charts
      chart: nginx-gateway-fabric
      targetRevision: 2.6.3
      helm:
        releaseName: ngf
        valueFiles:
          - $values/03-k8s-clusters/onprem/values/nginx-gateway-fabric-values.yaml
    - repoURL: https://github.com/Son-Hunseo/My-GitAIOps
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
