apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onprem-vault
  namespace: argocd
  annotations:
    # External Secrets 연동 대상이므로 operator 설치 이후 배치합니다.
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform
  sources:
    - repoURL: https://helm.releases.hashicorp.com
      chart: vault
      targetRevision: 0.28.1
      helm:
        valueFiles:
          - $values/03-k8s-clusters/onprem/values/vault-values.yaml
    - repoURL: https://github.com/Son-Hunseo/My-GitAIOps
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
