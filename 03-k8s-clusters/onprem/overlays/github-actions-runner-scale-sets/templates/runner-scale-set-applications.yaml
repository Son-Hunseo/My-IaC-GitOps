{{- $root := . -}}
{{- range $scaleSet := .Values.runnerScaleSets }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ printf "onprem-github-runner-%s" $scaleSet.name | trunc 63 | trimSuffix "-" | quote }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: platform
  sources:
    - repoURL: ghcr.io/actions/actions-runner-controller-charts
      chart: gha-runner-scale-set
      targetRevision: {{ $root.Values.runnerChartVersion | default "0.14.2" | quote }}
      helm:
        releaseName: {{ $scaleSet.name | quote }}
        valueFiles:
          - $values/03-k8s-clusters/onprem/values/github-runner-scale-set-values.yaml
        parameters:
          - name: githubConfigUrl
            value: {{ $scaleSet.githubConfigUrl | quote }}
          - name: runnerScaleSetName
            value: {{ $scaleSet.runnerScaleSetName | default $scaleSet.name | quote }}
          - name: minRunners
            value: {{ $scaleSet.minRunners | default $root.Values.runnerDefaults.minRunners | default 0 | quote }}
          - name: maxRunners
            value: {{ $scaleSet.maxRunners | default $root.Values.runnerDefaults.maxRunners | default 3 | quote }}
    - repoURL: https://github.com/Son-Hunseo/My-IaC-GitOps
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $scaleSet.namespace | default $root.Values.runnerDefaults.namespace | default "arc-runners" | quote }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
{{- end }}
