apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.runnerAuth.externalSecretName | default "github-runner-auth" | quote }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  refreshInterval: {{ .Values.runnerAuth.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ .Values.runnerAuth.secretStoreName | default "vault-platform" | quote }}
    kind: {{ .Values.runnerAuth.secretStoreKind | default "ClusterSecretStore" | quote }}
  target:
    name: {{ .Values.githubConfigSecret | quote }}
    creationPolicy: Owner
  data:
    - secretKey: github_token
      remoteRef:
        key: {{ .Values.runnerAuth.vaultSecretPath | default "platform/github-actions-runner" | quote }}
        property: {{ .Values.runnerAuth.githubTokenProperty | default "github_token" | quote }}
