apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: onprem-selfsigned-bootstrap
  namespace: nginx-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: onprem-root-ca
  namespace: nginx-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  isCA: true
  commonName: onprem internal root ca
  secretName: onprem-root-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: onprem-selfsigned-bootstrap
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: onprem-internal-ca
  namespace: nginx-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  ca:
    secretName: onprem-root-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: onprem-internal-wildcard
  namespace: nginx-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  secretName: onprem-internal-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - "*.onprem.arpa"
  issuerRef:
    name: onprem-internal-ca
    kind: Issuer
