apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    # 기존 bootstrap 단계에서 설치된 argocd-server Service로 내부 UI 트래픽을 전달합니다.
    argocd.argoproj.io/sync-wave: "4"
spec:
  parentRefs:
    - name: internal
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - argocd.onprem.arpa
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
