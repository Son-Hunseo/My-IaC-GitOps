apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
  namespace: vault
  annotations:
    # Vault UI는 운영 접근 정책에 맞춰 내부 DNS와 네트워크에서만 사용합니다.
    argocd.argoproj.io/sync-wave: "4"
spec:
  parentRefs:
    - name: internal
      namespace: nginx-gateway
      sectionName: https
  hostnames:
    - vault.onprem.arpa
  rules:
    - backendRefs:
        - name: onprem-vault
          port: 8200
