apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: onprem-l2-pool
  namespace: metallb-system
  annotations:
    # MetalLB CRD가 생성된 뒤 적용되도록 child Application보다 늦은 wave를 사용합니다.
    argocd.argoproj.io/sync-wave: "3"
spec:
  addresses:
    # 실제 On-Premise L2 네트워크에서 사용 가능한 IP 대역으로 반드시 변경하십시오.
    - 192.168.0.230-192.168.0.255
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: onprem-l2-advertisement
  namespace: metallb-system
  annotations:
    # address pool과 같은 wave에서 적용합니다.
    argocd.argoproj.io/sync-wave: "3"
spec:
  ipAddressPools:
    - onprem-l2-pool
