# cert-manager와 metallb-system 네임스페이스는 여기에 없습니다.
# 02-bootstrap의 kubespray add-on이 설치 매니페스트에서 직접 만듭니다.
apiVersion: v1
kind: Namespace
metadata:
  name: arc-systems
  annotations:
    # Actions Runner Controller operator 전용 네임스페이스입니다.
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: v1
kind: Namespace
metadata:
  name: arc-runners
  annotations:
    # GitHub Actions self-hosted runner Pod 전용 네임스페이스입니다.
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  annotations:
    # Prometheus와 Grafana를 함께 배치합니다.
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  annotations:
    # External Secrets Operator 전용 네임스페이스입니다.
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: v1
kind: Namespace
metadata:
  name: nginx-gateway
  annotations:
    # NGINX Gateway Fabric 전용 네임스페이스입니다.
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  annotations:
    # Vault 서버와 injector를 분리된 네임스페이스에 배치합니다.
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: v1
kind: Namespace
metadata:
  name: harbor
  annotations:
    # Harbor registry 구성요소 전용 네임스페이스입니다.
    argocd.argoproj.io/sync-wave: "0"
