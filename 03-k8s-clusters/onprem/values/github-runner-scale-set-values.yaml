githubConfigSecret: onprem-github-runner-auth

runnerAuth:
  externalSecretName: github-runner-auth
  secretStoreName: vault-platform
  secretStoreKind: ClusterSecretStore
  refreshInterval: 1h
  vaultSecretPath: platform/github-actions-runner
  githubTokenProperty: github_token

runnerChartVersion: 0.14.2

runnerDefaults:
  namespace: arc-runners
  minRunners: 0
  maxRunners: 3

runnerScaleSets:
  - name: my-blog-runner
    runnerScaleSetName: my-blog-runner
    githubConfigUrl: https://github.com/Son-Hunseo/blog
    minRunners: 0
    maxRunners: 3
  - name: my-chocoletter-runner
    runnerScaleSetName: my-chocoletter-runner
    githubConfigUrl: https://github.com/Son-Hunseo/chocoletter-refac
    minRunners: 0
    maxRunners: 3

controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-runner-scale-set-controller

template:
  spec:
    initContainers:
      - name: init-dind-externals
        image: ghcr.io/actions/actions-runner:latest
        command:
          - cp
          - -r
          - /home/runner/externals/.
          - /home/runner/tmpDir/
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      - name: dind
        image: docker:dind
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
        env:
          - name: DOCKER_GROUP_GID
            value: "123"
        securityContext:
          privileged: true
        restartPolicy: Always
        startupProbe:
          exec:
            command:
              - docker
              - info
          initialDelaySeconds: 0
          failureThreshold: 24
          periodSeconds: 5
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
          - name: harbor-registry-ca
            mountPath: /etc/docker/certs.d/harbor.onprem.arpa
            readOnly: true
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command:
          - /home/runner/run.sh
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: "120"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
    volumes:
      - name: work
        emptyDir: {}
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}
      - name: harbor-registry-ca
        secret:
          secretName: harbor-registry-ca
          optional: true
