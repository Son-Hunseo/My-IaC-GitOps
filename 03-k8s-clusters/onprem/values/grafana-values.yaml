# On-Premise에서는 Grafana를 ClusterIP로 두고 Internal Gateway HTTPRoute로 노출합니다.
service:
  type: ClusterIP
  port: 80

# 초기 admin password는 chart가 생성하는 Secret 또는 외부 Secret 연동으로 관리합니다.
admin:
  existingSecret: ""

persistence:
  enabled: true
  storageClassName: nas-sc
  size: 10Gi

deploymentStrategy:
  type: Recreate

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
