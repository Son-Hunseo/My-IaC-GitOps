# 예시 기본값입니다. 운영 환경에서는 HA storage, TLS, unseal 정책을 별도로 구성해야 합니다.
server:
  standalone:
    enabled: true
  ha:
    enabled: false
  dataStorage:
    enabled: true
    storageClass: nas-sc
    size: 20Gi
  service:
    type: ClusterIP

injector:
  enabled: true

ui:
  enabled: true
  serviceType: ClusterIP
